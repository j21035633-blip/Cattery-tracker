[pytest]
testpaths = tests
asyncio_mode = auto
# One event loop for the whole session: Motor binds its connection pool to the
# loop it was created on, so a per-test loop would break the shared client.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    error::DeprecationWarning:app.*
